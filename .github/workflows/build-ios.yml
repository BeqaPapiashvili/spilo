name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build iOS Archive
        run: |
          cd spilo-ios
          xcodebuild -project Spilo.xcodeproj \
            -scheme Spilo \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Spilo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Payload into unsigned .ipa
        run: |
          cd spilo-ios
          mkdir -p build/Payload
          cp -r build/Spilo.xcarchive/Products/Applications/Spilo.app build/Payload/
          cd build
          zip -r Spilo.ipa Payload
          cd ..

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spilo-iOS-IPA
          path: spilo-ios/build/Spilo.ipa
